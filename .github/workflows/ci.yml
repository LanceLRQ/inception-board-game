name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 数据库客户端是生成物，不入库；类型检查与测试都依赖它
      - run: pnpm --filter @icgame/server exec prisma generate
      - run: pnpm turbo lint typecheck
      - run: pnpm copyright:check

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icgame/server exec prisma generate
      # 跑全部单元测试并检查各包的覆盖率阈值
      - run: pnpm test:coverage
      - run: pnpm --filter @icgame/bot regression

  e2e-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/packages/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: game
      - run: pnpm --filter @icgame/server exec prisma generate
        working-directory: game
      # 浏览器安装包下载偶发中断，失败后重试
      - run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium chrome && exit 0
            echo "playwright install failed (attempt $attempt)"
            sleep 10
          done
          exit 1
      - run: pnpm test --project=desktop-chrome
      # 两个浏览器联机打完一局（全内存服务端，不需要数据库）
      - run: pnpm test:online
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-desktop-traces
          path: game/packages/e2e/test-results/
          retention-days: 3

  e2e-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/packages/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: game
      # 浏览器安装包下载偶发中断，失败后重试
      - run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt)"
            sleep 10
          done
          exit 1
      - run: pnpm test --project=mobile-android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-mobile-traces
          path: game/packages/e2e/test-results/
          retention-days: 3

  # iOS Safari 用的是 WebKit 内核；这组用例还没有在 WebKit 上跑通过，先不阻塞合并
  e2e-mobile-webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: game/packages/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: game
      # 浏览器安装包下载偶发中断，失败后重试
      - run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps webkit && exit 0
            echo "playwright install failed (attempt $attempt)"
            sleep 10
          done
          exit 1
      - run: pnpm test --project=mobile-ios

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate || true
