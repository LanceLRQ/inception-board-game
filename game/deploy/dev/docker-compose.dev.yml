# 盗梦都市 · 本机开发依赖（只有 Postgres 与 Redis，服务端与前端在宿主机用 pnpm dev 运行）
#
# 使用：./scripts/dev.sh up
# 数据落在 ./local 下（已被 git 忽略）。端口只绑定本机。
name: icg-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: icg-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: icgame
      POSTGRES_USER: icgame
      # 仅本机开发用的简单默认值，需与 .env 里的 DATABASE_URL 保持一致
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-icgame_dev_only}
    volumes:
      - ./local/pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icgame -d icgame"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: icg-dev-redis
    restart: unless-stopped
    # 这里存着进行中的对局，不设内存淘汰策略
    command: ["redis-server", "--requirepass", "${DEV_REDIS_PASSWORD:-icgame_dev_only}", "--appendonly", "yes"]
    volumes:
      - ./local/redis-data:/data
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-16379}:6379"
    healthcheck:
      # --no-auth-warning 只是不打印「密码出现在命令行」的提示，不影响鉴权
      test: ["CMD", "redis-cli", "-a", "${DEV_REDIS_PASSWORD:-icgame_dev_only}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
