# 盗梦都市 · 生产编排（postgres + redis + api + client）
#
# 使用：./scripts/prod.sh init → build → start → health
# 镜像由 prod.sh build 构建，这里不写 build 段。
# 数据 bind mount 到 ./data（已被 git 忽略）。postgres、redis 不映射宿主机端口。
name: icg-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: icg-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icgame}
      POSTGRES_USER: ${POSTGRES_USER:-icgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先运行 ./scripts/prod.sh init}
    volumes:
      - ./data/pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icgame} -d ${POSTGRES_DB:-icgame}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: icg-prod-redis
    restart: unless-stopped
    # 这里存着进行中的对局，不设内存淘汰策略
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先运行 ./scripts/prod.sh init}", "--appendonly", "yes"]
    volumes:
      - ./data/redis-data:/data
    healthcheck:
      # --no-auth-warning 只是不打印「密码出现在命令行」的提示，不影响鉴权
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_NAMESPACE:-icgame}/icgame-api:${IMAGE_TAG:-latest}
    container_name: icg-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ⚠️ 环境变量必须在这里逐项显式映射：prod.sh 传的 --env-file 只让 compose 在解析本文件时
      # 能取到 ${VAR} 做插值，并不会把 .env 的内容注入容器环境。漏掉一项不会报错，
      # 而是容器内读不到该变量、静默退回代码里的默认值（例如 JWT_SECRET 退回开发用的固定值）。
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-icgame}:${POSTGRES_PASSWORD}@icg-prod-postgres:5432/${POSTGRES_DB:-icgame}
      REDIS_URL: redis://:${REDIS_PASSWORD}@icg-prod-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请先运行 ./scripts/prod.sh init}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      RECOVERY_CODE_PEPPER: ${RECOVERY_CODE_PEPPER:?RECOVERY_CODE_PEPPER 未设置，请运行 ./scripts/prod.sh secrets 补生成}
      # 运营接口令牌，留空即关闭运营接口
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      OPERATOR_ID: ${OPERATOR_ID:-}
      # 留空 = 只允许同源（自带 nginx 是同源部署）；前后端分域名时填前端页面的源
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN:-}
      # 邀请链接分享卡片：站点对外地址（留空则取请求里的 Host）与缩略图路径
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      INVITE_IMAGE_PATH: ${INVITE_IMAGE_PATH:-/pwa-512x512.png}
      # api 前面是 nginx，限流按 X-Forwarded-For 的真实来源地址计数；后端端口直接暴露公网时不要开启
      TRUST_PROXY: ${TRUST_PROXY:-1}
      HTTP_RATE_LIMIT_PER_MINUTE: ${HTTP_RATE_LIMIT_PER_MINUTE:-300}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 对局节奏（毫秒）：Bot 每步间隔 / 待结算事项的应答时限 / 一个回合的时限；超时由服务端代为行动
      MATCH_BOT_STEP_DELAY_MS: ${MATCH_BOT_STEP_DELAY_MS:-600}
      MATCH_PENDING_TIMEOUT_MS: ${MATCH_PENDING_TIMEOUT_MS:-45000}
      MATCH_TURN_TIMEOUT_MS: ${MATCH_TURN_TIMEOUT_MS:-120000}
    ports:
      # 只绑定本机：外部（含局域网）一律经前端端口由 nginx 转发，后端不直接对外
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 每次启动：migrate deploy → 写入初始数据（预设短语与成就定义，幂等） → 启动服务
    command: >
      sh -c "cd /app/packages/server &&
             pnpm exec prisma migrate deploy &&
             pnpm exec prisma db seed &&
             pnpm exec tsx src/index.ts"

  client:
    image: ${IMAGE_NAMESPACE:-icgame}/icgame-client:${IMAGE_TAG:-latest}
    container_name: icg-prod-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 对所有网卡开放：局域网与外部用户从这里进
      - "${CLIENT_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  default:
    name: icg-prod-network
