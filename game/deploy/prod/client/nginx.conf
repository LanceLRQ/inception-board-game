# 盗梦都市 · 前端静态资源 + API 反代配置

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源强缓存（带 hash 的 Vite 产物）
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # PWA Service Worker 不缓存（必须走最新）
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # API 反向代理到 server 容器
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 房间邀请链接：服务端按访问者返回分享卡片（预览抓取器）或跳转到房间页（浏览器）
  location /invite/ {
    proxy_pass http://api:3001/invite/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 服务端按这两个头拼出站点的对外地址（没有配置 PUBLIC_BASE_URL 时）
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # WebSocket 反代（socket.io 默认 /ws；对局连接与房间推送共用这条）
  location /ws {
    proxy_pass http://api:3001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  # SPA fallback：未命中文件回落到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
